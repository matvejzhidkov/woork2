name: Full Stack Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        shell: powershell
        run: |
          @"
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          APP_PORT=${{ secrets.APP_PORT }}
          APP_SECRET=${{ secrets.APP_SECRET }}
          API_KEY=${{ secrets.API_KEY }}
          "@ | Out-File -FilePath .env -Encoding utf8

      - name: Deploy with Docker Compose
        shell: powershell
        run: |
          docker-compose up -d
          Start-Sleep -Seconds 15
          docker-compose ps

      - name: Test application and database
        shell: powershell
        run: |
          $port = "${{ secrets.APP_PORT }}"
          Write-Host "Testing application on port $port..."
          
          try {
              $health = Invoke-WebRequest -Uri "http://localhost:$port/health" -UseBasicParsing -TimeoutSec 10
              Write-Host "App is healthy. Status: $($health.StatusCode)"
          } catch {
              Write-Host "Web application health check failed!"
              exit 1
          }

      - name: Create test report
        shell: powershell
        run: |
          @"
          # Deployment Test Report
          - Date: $(Get-Date)
          - Status: Success
          - Port: ${{ secrets.APP_PORT }}
          "@ | Out-File -FilePath test-report.md -Encoding utf8

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
          retention-days: 30

      - name: Save Docker logs
        if: always()
        shell: powershell
        run: |
          docker-compose logs | Out-File -FilePath deployment-logs.txt -Encoding utf8

      - name: Upload Docker logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: deployment-logs.txt
          retention-days: 30 
